<section class="timeline" id="timeline" aria-label="Horario semanal"><div><div class="hours" id="hours"></div></div></section>
<section class="list" id="list" aria-label="Horario por día"></section>
<p class="hint">Tocá cualquier actividad para ver detalles y agregarla a tu calendario.</p>
</main>
<div class="mascot-wrap"><span class="wait pix">¡Te esperamos!</span><img class="mascot" src="assets/mapache.png" alt="Mascota mapache de la UNA" style="width:100%;display:block"></div>
</div>
<dialog id="dlg" aria-labelledby="d-title">
<div class="dhead" id="d-head"><div><span class="pix" id="d-day" style="font-size:12px"></span><h3 id="d-title"></h3></div><span class="ic" id="d-ic"></span></div>
<div class="dbody">
<dl><dt>Fecha</dt><dd id="d-date"></dd><dt>Hora</dt><dd id="d-time"></dd><dt>Lugar</dt><dd id="d-place"></dd></dl>
<p id="d-desc" style="margin:0;line-height:1.45;color:#cfe9ff"></p>
<div class="actions">
<a class="btn" id="d-reg" target="_blank" rel="noopener" style="background:#2fc6ff;border-color:#2fc6ff;color:#081f45">Inscribirme</a>
<span class="soon" id="d-soon">Inscripción: link próximamente</span>
<a class="btn" id="d-gcal" target="_blank" rel="noopener" style="background:#ffd23f;border-color:#ffd23f;color:#081f45">Agregar a Google Calendar</a>
<button type="button" class="btn" id="d-close" style="background:transparent;color:#eaf6ff">Cerrar</button>
</div>
</div>
</dialog>
<script>
var DAYS = [
  { name: 'Lunes', theme: 'Meet IEEE', accent: '#2fc6ff', date: 'lunes 5 de octubre', d: 5 },
  { name: 'Martes', theme: 'IEEE Day', accent: '#7cc63a', date: 'martes 6 de octubre', d: 6 },
  { name: 'Miércoles', theme: 'Chapters', accent: '#ffb020', date: 'miércoles 7 de octubre', d: 7 },
  { name: 'Jueves', theme: 'Tech Day', accent: '#ff4f8b', date: 'jueves 8 de octubre', d: 8 },
  { name: 'Viernes', theme: 'CENAT', accent: '#2fc6ff', date: 'viernes 9 de octubre', d: 9 }
];
var COLORS = { blue: '#0a74a6', green: '#4a8320', orange: '#b25a00', pink: '#b0195a' };
var EVENTS = [
  { day: 0, title: "Stand informativo", s: "12:00", e: "13:00", c: "blue", link: "", ic: "chat",
    place: "Frente a la soda Padre Royo",
    desc: "Find Your IEEE Society: descubrí qué sociedad de IEEE va con vos (Software, Salud, Energía, Ciencia, Ambiente, Robótica, Comunicaciones o Nano). IEEE Roulette: girá la ruleta (IEEE, Tecnología, IA, Robótica, Programación, Random o Reto) y ganá stickers, chocolates, pines, lapiceros o merch de IEEE." },
  { day: 0, title: "Stand informativo", s: "14:00", e: "15:00", c: "blue", link: "", ic: "chat",
    place: "Edificio de Generales",
    desc: "Find Your IEEE Society: descubrí qué sociedad de IEEE va con vos (Software, Salud, Energía, Ciencia, Ambiente, Robótica, Comunicaciones o Nano). IEEE Roulette: girá la ruleta (IEEE, Tecnología, IA, Robótica, Programación, Random o Reto) y ganá stickers, chocolates, pines, lapiceros o merch de IEEE." },
  { day: 1, title: "Engineering a Better Tomorrow", s: "10:00", e: "11:00", c: "green", link: "", ic: "gear",
    place: "Auditorio Marco Tulio, CIDE",
    desc: "Exposición corta (máx. 20 min) sobre IEEE Day e IEEE, y mini panel con un charlista del CENAT sobre proyectos, investigación e iniciativas de ciencia, ingeniería y tecnología que ayudan a construir un mejor futuro." },
  { day: 1, title: "Better Tomorrow Experience", s: "11:00", e: "12:00", c: "green", link: "", ic: "bulb",
    place: "Afueras del Auditorio Marco Tulio, CIDE",
    desc: "Actividades prácticas en grupos. A) Water Lab Filter: diseñá un filtro de agua con filtros de café y otros materiales. B) LEGO Mindstorms Robot Design: construí un prototipo de robot de limpieza. C) Natural pH Detector: hacé tiras de pH con repollo morado y comparalas con tiras comerciales." },
  { day: 1, title: "Celebración IEEE Day", s: "12:00", e: "14:30", c: "green", link: "", ic: "apple",
    place: "Afueras del Auditorio Marco Tulio, CIDE",
    desc: "Pastel IEEE Day, decoración oficial y foto grupal. Dos lonas con el logo de IEEE Day para dibujar o pintar lo que para vos representa o inspira un mejor futuro para la ingeniería." },
  { day: 2, title: "Stand Chapters", s: "11:00", e: "13:00", c: "orange", link: "", ic: "users",
    place: "Edificio de Biología y Matemática, por la soda de Biología",
    desc: "Conocé capítulos y grupos de afinidad IEEE como EMBS, NPSS y AESS. Cada uno tendrá una actividad interactiva de unos 40 minutos para presentar su área, proyectos y oportunidades de participación." },
  { day: 2, title: "Chapter AESS", s: "14:00", e: "15:30", c: "orange", link: "", ic: "rocket",
    place: "Aula de Biología",
    desc: "Charla introductoria a IEEE AESS y a la ingeniería aeroespacial y satelital, con un taller de papercraft del CubeSat Proyecto Irazú (BATSU-CS1), el primer satélite costarricense." },
  { day: 3, title: "Tech Playground", s: "9:30", e: "11:00", c: "pink", link: "", ic: "game",
    place: "Edificio de Generales",
    desc: "A) Fotosíntesis visible: experimento con discos de hojas bajo distintas condiciones de luz. B) Extracción de ADN de fresa. C) Science Escape Room: resolvé retos de ciencia, ingeniería y lógica en equipo antes de que se acabe el tiempo." },
  { day: 4, title: "Gira: CENAT", s: "9:00", e: "10:00", c: "blue", link: "", ic: "map",
    place: "Laboratorio CNCA-CeNAT",
    desc: "Visita al laboratorio CNCA-CeNAT, atendida por el investigador Fabricio Quirós y el técnico de infraestructura Edward Soto, quienes explicarán sobre KABRE." }
];
var ICS = ['chat', 'gear', 'bulb', 'apple', 'users', 'dish', 'game', 'map'];
function mins(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
function fmt(t) { var m = mins(t), h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? 'PM' : 'AM', h12 = h % 12 || 12; return h12 + ':' + (mm < 10 ? '0' : '') + mm + '\u00a0' + ap; }
function utc(d, t) { var m = mins(t) + 360, h = Math.floor(m / 60), mm = m % 60; return '202610' + (d < 10 ? '0' : '') + d + 'T' + (h < 10 ? '0' : '') + h + (mm < 10 ? '0' : '') + mm + '00Z'; }

var state = { day: -1 };
var PX = 80 / 60, START = 540;
var EV = EVENTS.map(function (ev, i) {
  var D = DAYS[ev.day];
  return Object.assign({}, ev, { i: i, D: D, color: COLORS[ev.c], time: fmt(ev.s) + ' – ' + fmt(ev.e),
    gcal: 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.title + ' · Semana U IEEE UNA') + '&dates=' + utc(D.d, ev.s) + '/' + utc(D.d, ev.e) + '&location=' + encodeURIComponent(ev.place) + '&details=' + encodeURIComponent(ev.desc + ' · ' + 'Semana Universitaria IEEE UNA · ' + D.name + ' ' + D.theme) });
});
function icon(k) { return '<img src="assets/el/' + k + '.png" alt="">'; }
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function card(e, cls, style) {
  return '<button type="button" class="' + cls + '" data-i="' + e.i + '" aria-label="' + esc(e.title + ', ' + e.D.name + ' ' + e.time) + '" style="' + style + 'background:' + e.color + '"><span>' + esc(e.title) + '<span style="display:block;font-size:11px;font-weight:700;opacity:.9;margin-top:3px">' + e.time + '</span></span><span class="ic">' + icon(e.ic) + '</span></button>';
}
document.getElementById('hours').innerHTML = [9, 10, 11, 12, 13, 14, 15, 16].map(function (h) {
  return '<div style="top:' + (h - 9) * 80 + 'px">' + (h % 12 || 12) + ':00 ' + (h >= 12 ? 'PM' : 'AM') + '<i></i></div>';
}).join('');
var tl = document.getElementById('timeline');
DAYS.forEach(function (D, di) {
  var col = document.createElement('div'); col.className = 'col'; col.dataset.day = di;
  col.innerHTML = '<div class="colhead"><h2 class="pix">' + D.name + ' · ' + D.theme + '</h2><span class="bar" style="background:' + D.accent + '"></span></div><div class="colbody">' +
    EV.filter(function (e) { return e.day === di; }).map(function (e) {
      var top = Math.round((mins(e.s) - START) * PX) + 6, h = Math.max(64, Math.round((mins(e.e) - mins(e.s)) * PX) - 6);
      return card(e, 'ev', 'top:' + top + 'px;min-height:' + h + 'px;');
    }).join('') + '</div>';
  tl.appendChild(col);
});
function render() {
  document.getElementById('tabs').innerHTML = [{ label: 'Todos', i: -1 }].concat(DAYS.map(function (D, i) { return { label: D.name, i: i }; })).map(function (t) {
    return '<button type="button" class="pix" data-day="' + t.i + '" aria-pressed="' + (state.day === t.i) + '">' + t.label + '</button>';
  }).join('');
  document.querySelectorAll('.timeline .col').forEach(function (c) { c.classList.toggle('dim', state.day >= 0 && +c.dataset.day !== state.day); });
  document.getElementById('list').classList.toggle('single', state.day >= 0);
  document.getElementById('list').innerHTML = DAYS.map(function (D, di) {
    if (state.day >= 0 && state.day !== di) return '';
    return '<div class="lday"><h2 class="pix"><span class="acc" style="width:14px;height:14px;background:' + D.accent + '"></span><span class="dt"><span>' + D.name + '</span><span>' + D.theme + '</span></span> <small>' + D.date + '</small></h2>' +
      EV.filter(function (e) { return e.day === di; }).map(function (e) { return card(e, 'lev', ''); }).join('') + '</div>';
  }).join('');
}
var dlg = document.getElementById('dlg');
function openEv(i) {
  var e = EV[i];
  dlg.style.borderColor = e.color; document.getElementById('d-head').style.background = e.color;
  document.getElementById('d-day').textContent = e.D.name + ' · ' + e.D.theme;
  document.getElementById('d-title').textContent = e.title;
  document.getElementById('d-ic').innerHTML = icon(e.ic);
  document.getElementById('d-date').textContent = e.D.date;
  document.getElementById('d-place').textContent = e.place;
  document.getElementById('d-desc').textContent = e.desc;
  document.getElementById('d-time').textContent = e.time;
  document.getElementById('d-gcal').href = e.gcal;
  var reg = document.getElementById('d-reg'), soon = document.getElementById('d-soon');
  reg.hidden = !e.link; soon.hidden = !!e.link; if (e.link) reg.href = e.link;
  dlg.showModal();
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-i]'); if (t) return openEv(+t.dataset.i);
  var d = ev.target.closest('.tabs [data-day]'); if (d) { state.day = +d.dataset.day; render(); var b = document.querySelector('.tabs [data-day="' + state.day + '"]'); if (b) b.focus(); }
});
document.getElementById('d-close').onclick = function () { dlg.close(); };
dlg.addEventListener('click', function (ev) { if (ev.target === dlg) dlg.close(); });
render();
</script>
</body>
</html>
